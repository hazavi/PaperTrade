name: papertrade


services:
  postgres:
    image: postgres:18.6-alpine
    container_name: papertrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - papertrade-network

  redis:
    image: redis:8-alpine
    container_name: papertrade-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - papertrade-network

  papertrade-api:
    image: papertrade-api:dev
    container_name: papertrade-api
    build:
      context: .
      dockerfile: src/backend/PaperTrade.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Cors__AllowedOrigins__0: "http://localhost:${WEB_PORT:-5173}"
      Redis__ConnectionString: "redis:6379"
      MarketData__Finnhub__ApiKey: "${FINNHUB_API_KEY:-}"
      MarketDataWorker__Enabled: "${MARKET_DATA_WORKER_ENABLED:-true}"
    ports:
      - "${API_PORT:-5044}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - papertrade-network
    volumes:
      - api-data-protection:/home/app/.aspnet/DataProtection-Keys
  
  papertrade-web:
    image: papertrade-web:dev
    container_name: papertrade-web
    build:
      context: .
      dockerfile: src/frontend/papertrade-web/Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:${API_PORT:-5044}"
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      papertrade-api:
        condition: service_healthy
    networks:
      - papertrade-network

volumes:
  postgres-data:
  api-data-protection:

networks:
  papertrade-network:
    driver: bridge
