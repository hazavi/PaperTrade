name: papertrade-production

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [papertrade-network]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [papertrade-network]

  papertrade-api:
    image: ${PAPERTRADE_API_IMAGE}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
      MarketData__Finnhub__ApiKey: ${FINNHUB_API_KEY}
      MarketData__TwelveData__ApiKey: ${TWELVE_DATA_API_KEY}
      MarketDataWorker__IntervalSeconds: ${MARKET_DATA_INTERVAL_SECONDS:-5}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ["${API_PORT:-8080}:8080"]
    volumes:
      - api-data-protection:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [papertrade-network]

  papertrade-web:
    image: ${PAPERTRADE_WEB_IMAGE}
    restart: unless-stopped
    ports: ["${WEB_PORT:-80}:80"]
    depends_on:
      papertrade-api: { condition: service_healthy }
    networks: [papertrade-network]

volumes:
  postgres-data:
  redis-data:
  api-data-protection:

networks:
  papertrade-network:
    driver: bridge
